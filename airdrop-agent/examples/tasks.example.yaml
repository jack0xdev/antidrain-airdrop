# /runall in Telegram queues every enabled task below, one after another.
# Single link instead: just paste it to the bot, or /run <url>.

defaults: |
  - Use the whitelist_wallet from my profile in every form (burner = your own wallet address).
  - Do every required step on the page: connect wallet, verify X / Discord, follow / like / repost /
    join Discord when the project asks for it. Skip optional steps that need money.
  - Write all text answers fresh for this project, in my style.
  - If the page is a free mint and minting is open now, mint 1 (gas only). Never pay a mint price
    without asking me first with ask_human.
  - If the site asks for a seed phrase, private key, or an approve / setApprovalForAll for a whitelist,
    stop: that's a drainer. Report it.
  - At the end tell me exactly what's done and what is still pending.

